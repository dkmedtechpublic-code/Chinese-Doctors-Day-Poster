<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="医者有光：一键生成医师节肖像海报" />
    <title>医者有光｜医师节海报生成器</title>
    <script type="module" crossorigin src="/Chinese-Doctors-Day-Poster/assets/index-Yjg6vVhm.js"></script>
    <link rel="stylesheet" crossorigin href="/Chinese-Doctors-Day-Poster/assets/index-CTbNt0s_.css">
  </head>
  <body>
    <div id="root"></div>
    <style>
      .brand-logo img { mix-blend-mode: normal !important; }
      @media (max-width: 840px) {
        .tool-header .brand-logo { right: 0 !important; }
        .site-footer img { display: block !important; }
      }
    </style>
    <script>
      const refreshBrandImages = () => {
        document.querySelectorAll("img[src]").forEach((image) => {
          const source = image.getAttribute("src") || "";
          if (!/(dkmedtech-logo|official-account-qr)/.test(source) || source.includes("brand-refresh=2")) return;
          const url = new URL(source, window.location.href);
          url.searchParams.set("brand-refresh", "2");
          image.src = url.toString();
        });
      };
      new MutationObserver(refreshBrandImages).observe(document.getElementById("root"), { childList: true, subtree: true });
      document.addEventListener("click", (event) => {
        const link = event.target.closest('a[href="/doctor-story.html"]');
        if (!link) return;
        event.preventDefault();
        window.location.assign("./doctor-story.html");
      });
    </script>
  </body>
</html>
