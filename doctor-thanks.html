<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医者有光｜献给医生</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4ece1;color:#77482f;font-family:KaiTi,STKaiti,"Microsoft YaHei",serif}.app{max-width:1040px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d7bca6;padding-bottom:12px}.head img{width:190px}.layout{display:grid;grid-template-columns:360px 1fr;gap:24px;margin-top:24px}.panel{background:#fffdf8;border-radius:18px;padding:20px;box-shadow:0 8px 30px #77482b12}.panel h2{margin:0;font-size:20px}.panel label{display:grid;gap:6px;margin-top:13px;font-size:13px}.panel input,.panel textarea{width:100%;border:1px solid #dfcbb7;border-radius:9px;padding:9px;background:#fff;color:#77482f;font:inherit}.panel textarea{height:130px;resize:vertical}.upload{height:100px;border:1px dashed #d79b78;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:#96634a;background:#fff8ee}.upload img{width:100%;height:100%;object-fit:cover;border-radius:9px}.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.themes button,.fit button{border:1px solid #dfcbb7;border-radius:8px;background:#fff;padding:7px 3px;color:#77482f;font:inherit;font-size:11px}.themes button.active,.fit button.active{border-color:#d79b78;background:#fff4e8}.fit{display:flex;gap:6px}.fit button{flex:1}.actions{display:grid;gap:8px;margin-top:18px}.actions button{padding:11px;border-radius:9px;font:inherit;cursor:pointer}.reset{border:1px solid #dfcbb7;background:#fff;color:#77482f}.download{border:0;background:#77482f;color:#fff;font-weight:700}.stage{background:linear-gradient(140deg,#70402c,#3d231a);border-radius:18px;padding:20px;display:grid;place-items:center}.stage canvas{width:min(100%,430px);height:auto;box-shadow:0 15px 38px #0005;background:#f4ece1;touch-action:none}.tip{color:#f7deca;font-size:11px;text-align:center}@media(max-width:760px){.app{padding:14px}.layout{display:flex;flex-direction:column}.stage{order:-1;padding:14px}.head p{display:none}.head img{width:160px}}
</style>
<body><main class="app"><header class="head"><p>Chinese Doctors' Day · 08.19</p><a href="https://www.dkmedtech.com/" target="_blank"><img src="./dkmedtech-logo.png" alt="鼎科医疗"></a></header><section class="layout"><aside class="panel"><h2>医师节海报生成器</h2><label class="upload"><input id="file" type="file" accept="image/*" hidden><span id="uploadText">＋<br>上传照片</span><img id="thumb" hidden></label><label>照片缩放 <b id="zoomText">118%</b><input id="zoom" type="range" min="1" max="2" step=".01" value="1.18"></label><label>照片适配</label><div class="fit"><button class="active" data-fit="cover">铺满画框</button><button data-fit="contain">完整显示</button></div></label><label>画面配色</label><div class="themes"><button class="active" data-theme="warm">暖棕温暖</button><button data-theme="jade">青绿守护</button><button data-theme="ink">深蓝智慧</button><button data-theme="rose">绯色致敬</button></div></label><label>主标题<input id="title" value="医者有�? maxlength="8"></label><label>感恩寄语<textarea id="wish"></textarea></label><label>自定义落款（选填）<input id="sign" placeholder="默认：致敬每一位医者"></label><div class="actions"><button id="reset" class="reset">�?恢复默认</button><button id="download" class="download">下载高清海报</button></div></aside><section class="stage"><div><canvas id="poster" width="1160" height="1920"></canvas><p class="tip">拖动海报内照片调整位置；导出固定比例 2320 × 3840</p></div></section></section></main>
<script>
const $=s=>document.querySelector(s),canvas=$('#poster'),ctx=canvas.getContext('2d'),defaultWish='以仁心为灯，照亮希望之路\n以精诚为盾，守护万家安康\n每一次全力以赴，都值得被铭记\n每一份默默坚守，都应当被致敬\n愿医者心安，愿岁月无恙\n感恩所有守护生命的人。';$('#wish').value=defaultWish;let photo=null,zoom=1.18,pos={x:0,y:0},fit='cover',theme='warm',drag=null;const colors={warm:['#f4ece1','#77482f','#96634a','#d79b78','#84967c'],jade:['#edf3ed','#214f4c','#46766c','#3c8f78','#779d87'],ink:['#eef0ed','#183958','#50718b','#4e86b8','#789684'],rose:['#faedf2','#6d2f4d','#99496b','#d66183','#a47898']};const group=new Image();group.crossOrigin='anonymous';group.src='./doctor-group-source.png';const mark=new Image();mark.crossOrigin='anonymous';mark.src='./dkmedtech-poster-mark.png';function arch(x,y,w,h){ctx.beginPath();ctx.moveTo(x,y+w*.23);ctx.ellipse(x+w/2,y+w*.23,w/2,w*.23,0,Math.PI,0);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath()}function draw(){let [paper,brown,muted,coral,green]=colors[theme];ctx.fillStyle=paper;ctx.fillRect(0,0,1160,1920);ctx.fillStyle='#fffaf1';ctx.beginPath();ctx.arc(950,150,260,0,7);ctx.fill();ctx.drawImage(mark,1060,42,66,66);ctx.fillStyle=brown;ctx.font='600 38px KaiTi';ctx.fillText('第九个',,82,105);ctx.font='700 102px KaiTi';ctx.fillText('中国医师节',,76,215);ctx.fillStyle=muted;ctx.font='600 29px KaiTi';ctx.fillText('鼎科医疗 · 致敬中国医师',80,272);let x=80,y=420,w=510,h=830;ctx.strokeStyle=coral;ctx.lineWidth=4;arch(x,y,w,h);ctx.stroke();ctx.save();arch(x+9,y+9,w-18,h-18);ctx.clip();ctx.fillStyle='#ead8c4';ctx.fillRect(x+9,y+9,w-18,h-18);if(photo){let scale=(fit==='cover'?Math.max((w-18)/photo.width,(h-18)/photo.height):Math.min((w-18)/photo.width,(h-18)/photo.height))*zoom,dw=photo.width*scale,dh=photo.height*scale,dx=x+9+(w-18-dw)/2+(dw-w+18)*pos.x/2,dy=y+9+(h-18-dh)/2+(dh-h+18)*pos.y/2;ctx.drawImage(photo,dx,dy,dw,dh)}else{ctx.fillStyle=muted;ctx.font='32px KaiTi';ctx.fillText('你的照片',245,790)}ctx.restore();ctx.strokeStyle='#fffaf1';ctx.lineWidth=6;arch(x+9,y+9,w-18,h-18);ctx.stroke();ctx.fillStyle=brown;ctx.font='700 73px KaiTi';ctx.fillText($('#title').value||'医者有光',,655,770);ctx.fillStyle=coral;ctx.fillRect(658,810,120,6);ctx.fillStyle=brown;ctx.font='600 29px KaiTi';$('#wish').value.split('\n').slice(0,7).forEach((t,i)=>ctx.fillText(t,655,885+i*55));ctx.font='600 31px KaiTi';ctx.fillText($('#sign').value||'致敬每一位医者',,655,1310);ctx.save();ctx.globalAlpha=.76;ctx.drawImage(group,480,1335,760,590);ctx.restore();ctx.strokeStyle=coral;ctx.beginPath();ctx.moveTo(80,1600);ctx.lineTo(570,1600);ctx.stroke();ctx.fillStyle=brown;ctx.font='700 42px KaiTi';ctx.fillText('愿初心不改，共赴健康未来',160,1685);ctx.fillStyle=muted;ctx.font='22px Arial';ctx.fillText('THANK YOU, DOCTORS',375,1730)}function refresh(){requestAnimationFrame(draw)}$('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);photo=new Image();photo.onload=()=>{$('#thumb').src=u;$('#thumb').hidden=false;$('#uploadText').hidden=true;pos={x:0,y:0};refresh()};photo.src=u};$('#zoom').oninput=e=>{zoom=+e.target.value;$('#zoomText').textContent=Math.round(zoom*100)+'%';refresh()};document.querySelectorAll('[data-fit]').forEach(b=>b.onclick=()=>{fit=b.dataset.fit;document.querySelectorAll('[data-fit]').forEach(x=>x.classList.toggle('active',x===b));refresh()});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('active',x===b));refresh()});['title','wish','sign'].forEach(id=>$('#'+id).oninput=refresh);canvas.onpointerdown=e=>{if(photo){drag={x:e.clientX,y:e.clientY,px:pos.x,py:pos.y};canvas.setPointerCapture(e.pointerId)}};canvas.onpointermove=e=>{if(drag){let r=canvas.getBoundingClientRect();pos.x=Math.max(-1,Math.min(1,drag.px+(e.clientX-drag.x)/r.width*2));pos.y=Math.max(-1,Math.min(1,drag.py+(e.clientY-drag.y)/r.height*2));refresh()}};canvas.onpointerup=()=>drag=null;$('#reset').onclick=()=>{photo=null;$('#file').value='';$('#thumb').hidden=true;$('#uploadText').hidden=false;zoom=1.18;pos={x:0,y:0};theme='warm';$('#title').value='医者有�?;$('#wish').value=defaultWish;$('#sign').value='';$('#zoom').value=zoom;$('#zoomText').textContent='118%';refresh()};$('#download').onclick=()=>{let out=document.createElement('canvas');out.width=2320;out.height=3840;out.getContext('2d').drawImage(canvas,0,0,2320,3840);let a=document.createElement('a');a.download='医者有光-医师节海报.png';a.href=out.toDataURL('image/png');a.click()};Promise.all([new Promise(r=>group.onload=r),new Promise(r=>mark.onload=r)]).then(refresh);
</script></body></html>
