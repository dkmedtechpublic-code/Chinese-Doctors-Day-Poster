<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我是医生｜我的医路</title>
  <style>
    :root{--ink:#6e4025;--muted:#845238;--accent:#b7794f;--paper:#f8f2e7;--soft:#ead8c3}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#f4ebdf,#e9dbc9);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",serif}
    .page{width:min(1180px,100%);margin:auto;padding:0 24px 42px}.site-header{height:82px;position:relative;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(119,72,47,.16)}.site-header p{margin:0;color:#96634a;font:16px "STKaiti",KaiTi,serif;letter-spacing:.06em}.site-logo{position:absolute;right:0;display:flex;align-items:center}.site-logo img{display:block;width:270px;height:66px;object-fit:contain;object-position:right center;mix-blend-mode:multiply}
    .tabs{width:fit-content;display:flex;justify-content:center;gap:0;margin:20px auto 26px;padding:3px;border:1px solid rgba(119,72,47,.26);border-radius:10px;background:#f1e4d4;box-shadow:inset 0 2px 5px rgba(96,57,32,.13);overflow:hidden}.tabs a,.tabs b{min-width:126px;padding:10px 19px;border:0;border-radius:7px;color:var(--ink);font:600 14px "STKaiti",KaiTi,serif;text-align:center;text-decoration:none}.tabs a{background:#fffdf8;box-shadow:0 3px 7px rgba(96,57,32,.18);transform:translateY(-1px)}.tabs b{background:#e5d2bc;box-shadow:inset 0 2px 5px rgba(96,57,32,.2)}
    .hero{text-align:center;margin:0 auto 34px}.hero p{margin:0;color:#80533b;font-size:11px;letter-spacing:.18em;font-weight:800}.hero h1{font:600 clamp(40px,4.2vw,52px)/1.08 KaiTi,STKaiti,serif;margin:8px 0 2px;letter-spacing:-.04em}.hero .hero-description{margin-top:10px;color:#80533b;font-size:16px;font-weight:400;letter-spacing:0}
    .workspace{display:grid;grid-template-columns:355px minmax(0,1fr);gap:22px;align-items:start}.panel{background:rgba(255,253,248,.94);border:1px solid rgba(255,255,255,.8);box-shadow:0 14px 38px rgba(93,53,28,.1);border-radius:22px;padding:20px}.section-title{display:flex;align-items:center;gap:8px;margin:0 0 10px;color:#78472c;font-size:15px;font-weight:700}.section-title:not(:first-child){margin-top:24px}.section-title:before{content:"";width:5px;height:5px;border-radius:50%;background:#c98257}.hint{margin:-2px 0 14px;color:#9b7258;font-size:10px;line-height:1.7}
    .upload{display:grid;gap:7px}.upload-label{display:flex;justify-content:space-between;color:#7d5038;font-size:12px}.upload-box{height:142px;display:grid;place-items:center;overflow:hidden;cursor:pointer;border:1px dashed #d89c76;border-radius:12px;background:#fffaf3;color:#a47053;transition:.2s}.upload-box:hover{border-color:#9c5e3c;background:#fff7ee}.upload-box img{width:100%;height:100%;object-fit:cover}.upload-box span{font-size:12px;text-align:center;line-height:1.7}
    .control{display:grid;gap:6px;margin-top:12px}.control label,.subtitle-label{color:#87583e;font-size:11px}.subtitle-label{display:flex;align-items:center;justify-content:space-between;gap:8px}.subtitle-label button{padding:2px 7px;border-radius:7px;background:#fff8ef;color:#8a5635;font-size:10px}input,select,button{font:inherit}input[type=text],select{width:100%;border:1px solid #e0c7ae;background:#fffdfa;color:#603920;padding:10px 11px;border-radius:10px;outline:none}input[type=text]:focus,select:focus{border-color:#a86642;box-shadow:0 0 0 3px rgba(168,102,66,.1)}input[type=range]{width:100%;accent-color:#8a5635}.slider-value{float:right;color:#a06948}
    .theme-switch{display:grid;grid-template-columns:1fr 1fr;gap:7px}.theme-choice{padding:9px 7px;font-size:11px;color:#754529;background:#fffdfa;border:1px solid #e2c7b0;border-radius:11px}.theme-choice.active{color:#fff;background:#8a5635;border-color:#8a5635;box-shadow:inset 0 2px 5px rgba(0,0,0,.18)}.buttons{display:grid;gap:9px;margin-top:20px}button{cursor:pointer;border-radius:11px;padding:12px;border:1px solid #e2c7b0;background:#fffaf5;color:#754529}.primary{border:0;background:linear-gradient(100deg,#754529,#9c603b);color:#fff;font-weight:700;box-shadow:0 9px 16px rgba(107,60,34,.18)}.ai-button{display:flex;justify-content:center;align-items:center;gap:7px}.ai-button[disabled]{opacity:.58;cursor:wait}.status{min-height:30px;margin:10px 0 0;color:#976346;font-size:11px;line-height:1.55}.status.error{color:#a33f42}
    .stage{min-height:700px;display:grid;place-items:center;padding:24px;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 18% 12%,#956042 0,#70402c 38%,#3a2119 100%);box-shadow:0 17px 38px rgba(67,37,22,.18)}.stage canvas{display:block;width:min(100%,500px);height:auto;background:var(--paper);box-shadow:0 20px 38px rgba(18,8,4,.35);touch-action:none;user-select:none}.stage-note{margin:14px 0 0;color:#f6dabe;font-size:12px;text-align:center}.site-footer{margin-top:34px;padding-top:20px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(119,72,47,.18);color:#96634a;font:13px "STKaiti",KaiTi,serif}.site-footer p{margin:0}.site-footer div{display:flex;align-items:center;gap:12px}.site-footer img{width:112px;height:112px;padding:4px;background:#fff;border:1px solid rgba(119,72,47,.18)}.site-footer span{font-size:12px}
    @media(max-width:760px){.page{padding:0 14px 32px}.site-header{height:66px;justify-content:flex-start}.site-header p{font-size:12px;letter-spacing:.02em;white-space:nowrap}.site-logo img{width:160px;height:45px}.workspace{display:flex;flex-direction:column;gap:14px}.stage{order:-1;min-height:0;padding:18px 10px 14px}.panel{width:100%}.hero h1{font-size:21px}.hero .hero-description{max-width:100%;padding:0 6px;font-size:11px;line-height:1.65;white-space:normal;overflow-wrap:anywhere}.site-footer{margin-top:25px;padding-top:18px;flex-direction:column;gap:14px;text-align:center}}
  </style>
</head>
<body>
  <main class="page">
    <header class="site-header"><p>第九个中国医师节 · 致敬每一位中国医师</p><a class="site-logo" href="https://www.dkmedtech.com/" target="_blank" rel="noreferrer" aria-label="鼎科医疗官网"><img src="/dkmedtech-logo.png" alt="鼎科医疗 DK MEDTECH"></a></header>
    <nav class="tabs" aria-label="海报类型"><b>我是医生</b><a href="/">献给医生</a></nav>
    <header class="hero"><p>CHINESE DOCTORS' DAY · MY MEDICAL JOURNEY</p><h1>我的医路 · 初心如一</h1><p class="hero-description">上传一张历史照片，生成以你为主角的素描线稿主视觉，留下专属医路纪念。</p></header>
    <section class="workspace">
      <aside class="panel">
        <div class="section-title">历史照片</div><p class="hint">这张照片会作为小尺寸的时光印记，同时用于生成中央的素描主视觉。</p>
        <label class="upload"><span class="upload-label"><span>上传照片</span><span id="photoYearLabel">2016</span></span><span class="upload-box"><input id="photoFile" type="file" accept="image/*" hidden><span id="photoText">＋<br>上传历史照片</span><img id="photoThumb" hidden alt="历史照片预览"></span></label>
        <div class="control"><label for="photoYear">照片年份</label><input id="photoYear" type="text" inputmode="numeric" maxlength="4" value="2016"></div>
        <div class="control"><label for="photoZoom">照片缩放 <span class="slider-value" id="photoZoomValue">110%</span></label><input id="photoZoom" type="range" min=".7" max="2" step=".01" value="1.1"></div>
        <div class="section-title">AI 素描主视觉</div><p class="hint">自动识别人物主体，生成适用于海报中央的细腻铅笔线稿。照片仅用于本次生成。</p>
        <button id="generateSketch" class="primary ai-button" type="button">✦ 生成我的素描线稿</button><p id="status" class="status">上传照片后，即可生成。</p>
        <div class="control"><label for="sketchZoom">线稿缩放 <span class="slider-value" id="sketchZoomValue">100%</span></label><input id="sketchZoom" type="range" min=".7" max="1.55" step=".01" value="1"></div>
        <div class="section-title">文字与主题</div>
        <div class="control"><label for="template">主标题</label><select id="template"><option value="我的医路">我的医路</option><option value="{years}年医路，向光而行">__年医路，向光而行</option><option value="执医{years}年，热爱不减">执医__年，热爱不减</option><option value="行医{years}年，不负热爱">行医__年，不负热爱</option><option value="执灯行医，岁岁经年">执灯行医，岁岁经年</option></select></div>
        <div class="control"><label for="practiceYears">从医年限（年）</label><input id="practiceYears" type="text" inputmode="numeric" maxlength="2" value="10"></div>
        <div class="control"><div class="subtitle-label"><label for="storySubtitle">副标题</label><button id="randomSubtitle" type="button">换一句</button></div><input id="storySubtitle" type="text" maxlength="28" value="每一段时光，都在为生命守望"></div>
        <div class="theme-switch" role="group" aria-label="画面配色"><button type="button" class="theme-choice active" data-theme="warm">暖棕温暖</button><button type="button" class="theme-choice" data-theme="jade">青绿守护</button><button type="button" class="theme-choice" data-theme="ink">深蓝智慧</button><button type="button" class="theme-choice" data-theme="rose">绯色致敬</button></div>
        <div class="buttons"><button id="reset" type="button">恢复默认</button><button id="download" class="primary" type="button">下载高清海报</button></div>
      </aside>
      <section class="stage"><div><canvas id="poster" width="1160" height="1920" aria-label="我的医路海报预览"></canvas><p class="stage-note">拖动图片可改变位置</p></div></section>
    </section>
    <footer class="site-footer"><p>© 2026 苏州鼎科医疗技术股份有限公司.</p><div><img src="/official-account-qr.jpg" alt="鼎科医疗微信公众号二维码"><span>关注鼎科医疗公众号</span></div></footer>
  </main>
  <script>
  (()=>{
    const W=1160,H=1920,$=s=>document.querySelector(s),canvas=$('#poster');
    const state={photo:null,sketch:null,photoData:'',photoZoom:1.1,sketchZoom:1,theme:'warm',pos:{photo:{x:0,y:0},sketch:{x:0,y:0}}};
    const logo=new Image();logo.onload=draw;logo.src='./dkmedtech-poster-mark.png';
    const themes={warm:{paper:'#f8f2e7',ink:'#6e4025',muted:'#845238',accent:'#b7794f',soft:'#ead8c3',stream:'rgba(142,94,55,.20)'},jade:{paper:'#eef5f1',ink:'#20564f',muted:'#37746b',accent:'#4e8a7d',soft:'#d7e7df',stream:'rgba(37,107,94,.20)'},ink:{paper:'#eef3f7',ink:'#193e60',muted:'#356a93',accent:'#4c86b5',soft:'#d8e7f2',stream:'rgba(37,87,130,.20)'},rose:{paper:'#fbf0f4',ink:'#722e4d',muted:'#994b6b',accent:'#cb6687',soft:'#f2d9e2',stream:'rgba(142,62,96,.20)'}};
    const subtitles=['每一段时光，都在为生命守望','岁月流转，仁心始终如一','一路向前，只为守护生命','医路有光，步履不停','时间沉淀专业，也珍藏热爱','把青春留给医路，把温暖留给患者'];
    const frames={sketch:{x:236,y:505,w:688,h:820},photo:{x:92,y:1146,w:350,h:470}};
    function round(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
    function fit(g,text,max,font){g.font=font;let s=parseInt(font,10);while(g.measureText(text).width>max&&s>22){s-=2;g.font=font.replace(/^\d+px/,s+'px')}return g.font}
    function drawPhoto(g,img,f,zoom,pos,placeholder,blend){g.save();round(g,f.x,f.y,f.w,f.h,4);g.clip();if(img){const sc=Math.max(f.w/img.width,f.h/img.height)*zoom,dw=img.width*sc,dh=img.height*sc;g.globalCompositeOperation=blend||'source-over';g.drawImage(img,f.x+(f.w-dw)/2+(dw-f.w)*pos.x/2,f.y+(f.h-dh)/2+(dh-f.h)*pos.y/2,dw,dh);g.globalCompositeOperation='source-over'}else{g.fillStyle='#ede0ce';g.fillRect(f.x,f.y,f.w,f.h);g.strokeStyle='rgba(124,76,43,.26)';g.lineWidth=2;for(let i=-f.h;i<f.w;i+=34){g.beginPath();g.moveTo(f.x+i,f.y);g.lineTo(f.x+i+f.h,f.y+f.h);g.stroke()}g.fillStyle='#a57758';g.font='28px KaiTi,serif';g.textAlign='center';g.fillText(placeholder,f.x+f.w/2,f.y+f.h/2)}g.restore()}
    function timeFlow(g,p){g.save();g.strokeStyle=p.stream;g.lineWidth=2;for(let i=0;i<23;i++){g.beginPath();g.moveTo(-80,220+i*18);g.bezierCurveTo(175,138+i*3,395,440-i*5,732,294+i*9);g.bezierCurveTo(900,228+i*8,1010,185+i*3,1230,318+i*13);g.stroke()}for(let i=0;i<15;i++){g.beginPath();g.moveTo(700+i*25,-20);g.bezierCurveTo(920,164+i*4,1002,160,1210,90+i*20);g.stroke()}g.restore()}
    function render(target,scale=1){const p=themes[state.theme],g=target.getContext('2d');g.setTransform(scale,0,0,scale,0,0);g.clearRect(0,0,W,H);g.fillStyle=p.paper;g.fillRect(0,0,W,H);g.fillStyle=p.stream;g.globalAlpha=.45;for(let y=23;y<H;y+=23)for(let x=23;x<W;x+=23){g.beginPath();g.arc(x+(y/23%2?7:0),y,1,0,Math.PI*2);g.fill()}g.globalAlpha=1;timeFlow(g,p);
      const years=$('#practiceYears').value.trim()||'10',title=$('#template').value.replace('{years}',years),subtitle=$('#storySubtitle').value.trim()||subtitles[0];g.textAlign='center';g.fillStyle=p.muted;g.font='600 21px Arial,sans-serif';g.letterSpacing='3px';g.fillText("CHINESE DOCTORS' DAY · MY MEDICAL JOURNEY",580,178);g.fillStyle=p.ink;fit(g,title,920,'102px KaiTi,STKaiti,serif');g.fillText(title,580,328);g.fillStyle=p.accent;fit(g,subtitle,920,'43px KaiTi,STKaiti,serif');g.fillText(subtitle,580,408);g.letterSpacing='0px';
      if(logo.complete&&logo.naturalWidth)g.drawImage(logo,1035,24,99,99);else{g.fillStyle=p.accent;g.beginPath();g.arc(1085,74,40,0,Math.PI*2);g.fill()}
      g.fillStyle=p.muted;g.globalAlpha=.54;g.font='18px Georgia,serif';g.fillText('PAST',245,1035);g.fillText('NOW',578,1035);g.fillText('FORWARD',908,1035);g.globalAlpha=1;g.strokeStyle=p.accent;g.lineWidth=3;g.beginPath();g.moveTo(170,1062);g.lineTo(986,1062);g.stroke();[170,580,986].forEach(x=>{g.fillStyle=p.accent;g.beginPath();g.arc(x,1062,8,0,Math.PI*2);g.fill()});
      g.save();g.shadowColor='rgba(74,40,20,.18)';g.shadowBlur=28;g.shadowOffsetY=16;g.fillStyle='#fffdf8';round(g,frames.sketch.x-16,frames.sketch.y-16,frames.sketch.w+32,frames.sketch.h+32,36);g.fill();g.restore();drawPhoto(g,state.sketch,frames.sketch,state.sketchZoom,state.pos.sketch,'AI 素描主视觉','multiply');g.strokeStyle=p.accent;g.lineWidth=4;round(g,frames.sketch.x,frames.sketch.y,frames.sketch.w,frames.sketch.h,28);g.stroke();
      g.save();g.shadowColor='rgba(74,40,20,.18)';g.shadowBlur=20;g.shadowOffsetY=12;g.fillStyle=p.soft;round(g,frames.photo.x-12,frames.photo.y-12,frames.photo.w+24,frames.photo.h+104,20);g.fill();g.restore();drawPhoto(g,state.photo,frames.photo,state.photoZoom,state.pos.photo,'历史照片');g.strokeStyle=p.accent;g.lineWidth=3;g.strokeRect(frames.photo.x,frames.photo.y,frames.photo.w,frames.photo.h);g.fillStyle=p.ink;g.font='italic 44px Georgia,serif';g.fillText($('#photoYear').value||'2016',frames.photo.x+frames.photo.w/2,frames.photo.y+frames.photo.h+60);
      g.strokeStyle=p.accent;g.lineWidth=2;g.beginPath();g.moveTo(160,1670);g.lineTo(1000,1670);g.stroke();g.fillStyle=p.ink;g.font='56px KaiTi,STKaiti,serif';g.fillText('时间在变，守护不变',580,1760);g.fillStyle=p.muted;g.font='25px KaiTi,serif';g.fillText('每一段时光，都在为生命守望',580,1810);g.font='21px Arial,sans-serif';g.fillText('DK MEDTECH · THANK YOU DOCTORS',580,1858);g.textAlign='left'}
    function draw(){render(canvas,1)}
    function refresh(){ $('#photoYearLabel').textContent=$('#photoYear').value||'2016';draw() }
    $('#photoFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(f.size>8*1024*1024){setStatus('请上传小于 8MB 的图片。',true);return}const url=URL.createObjectURL(f),img=new Image();const reader=new FileReader();reader.onload=()=>{state.photoData=reader.result};reader.readAsDataURL(f);img.onload=()=>{state.photo=img;state.sketch=null;state.pos={photo:{x:0,y:0},sketch:{x:0,y:0}};$('#photoThumb').src=url;$('#photoThumb').hidden=false;$('#photoText').hidden=true;setStatus('照片已上传，可生成素描主视觉。');draw()};img.src=url});
    function setStatus(text,error=false){const el=$('#status');el.textContent=text;el.classList.toggle('error',error)}
    $('#generateSketch').addEventListener('click',async()=>{if(!state.photoData){setStatus('请先上传一张照片。',true);return}const button=$('#generateSketch');button.disabled=true;button.textContent='正在生成线稿…';setStatus('正在识别人物主体并绘制素描，请稍候。');try{const r=await fetch('/api/portrait-sketch',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image:state.photoData})});const data=await r.json();if(!r.ok)throw new Error(data.error||'生成失败，请稍后重试。');const img=new Image();img.onload=()=>{state.sketch=img;state.pos.sketch={x:0,y:0};setStatus('素描主视觉已生成，可在海报上拖动位置。');draw()};img.src=data.image}catch(err){setStatus(err.message||'生成失败，请稍后重试。',true)}finally{button.disabled=false;button.textContent='✦ 重新生成素描线稿'}});
    ['template','practiceYears','photoYear','storySubtitle'].forEach(id=>$('#'+id).addEventListener('input',refresh));$('#randomSubtitle').addEventListener('click',()=>{const current=$('#storySubtitle').value,items=subtitles.filter(x=>x!==current);$('#storySubtitle').value=items[Math.floor(Math.random()*items.length)];draw()});
    [['photoZoom','photoZoomValue','photoZoom'],['sketchZoom','sketchZoomValue','sketchZoom']].forEach(([id,label,key])=>$('#'+id).addEventListener('input',e=>{state[key]=+e.target.value;$('#'+label).textContent=Math.round(state[key]*100)+'%';draw()}));
    document.querySelectorAll('.theme-choice').forEach(btn=>btn.addEventListener('click',()=>{state.theme=btn.dataset.theme;document.querySelectorAll('.theme-choice').forEach(x=>{const active=x===btn;x.classList.toggle('active',active);x.style.background=active?themes[state.theme].ink:'';x.style.borderColor=active?themes[state.theme].ink:''});draw()}));
    let drag=null;canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;const hit=Object.keys(frames).reverse().find(k=>{const f=frames[k];return x>=f.x&&x<=f.x+f.w&&y>=f.y&&y<=f.y+f.h});if(!hit||(hit==='sketch'&&!state.sketch)||(hit==='photo'&&!state.photo))return;drag={kind:hit,x:e.clientX,y:e.clientY,pos:{...state.pos[hit]}};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const r=canvas.getBoundingClientRect(),dx=(e.clientX-drag.x)*W/r.width,dy=(e.clientY-drag.y)*H/r.height;state.pos[drag.kind]={x:Math.max(-1,Math.min(1,drag.pos.x+dx/180)),y:Math.max(-1,Math.min(1,drag.pos.y+dy/180))};draw()});['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t,()=>drag=null));
    $('#reset').addEventListener('click',()=>{state.photo=state.sketch=null;state.photoData='';state.photoZoom=1.1;state.sketchZoom=1;state.theme='warm';state.pos={photo:{x:0,y:0},sketch:{x:0,y:0}};$('#photoFile').value='';$('#photoThumb').hidden=true;$('#photoText').hidden=false;$('#photoYear').value='2016';$('#practiceYears').value='10';$('#template').selectedIndex=0;$('#storySubtitle').value=subtitles[0];$('#photoZoom').value=1.1;$('#sketchZoom').value=1;$('#photoZoomValue').textContent='110%';$('#sketchZoomValue').textContent='100%';$('#photoYearLabel').textContent='2016';document.querySelectorAll('.theme-choice').forEach(x=>{x.classList.toggle('active',x.dataset.theme==='warm');x.style.background='';x.style.borderColor=''});setStatus('上传照片后，即可生成。');draw()});
    $('#download').addEventListener('click',()=>{const out=document.createElement('canvas');out.width=2320;out.height=3840;render(out,2);const a=document.createElement('a');a.download='我的医路-医师节海报.png';a.href=out.toDataURL('image/png');a.click()});
    draw();
  })();
  </script>
</body>
</html>
